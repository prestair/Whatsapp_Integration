<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Report</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; }
    /* Green ribbon - single line, fits any screen (no scroll) */
    .ribbon {
      display: flex; align-items: center; gap: 6px;
      background: #128C7E; color: #fff; padding: 5px 8px;
      flex-wrap: nowrap; white-space: nowrap; overflow: hidden;
    }
    .ribbon-title { font-weight: 700; font-size: 0.82rem; flex-shrink: 0; }
    .ribbon-summary { display: flex; gap: 4px; flex-shrink: 0; font-size: 0.72rem; }
    .ribbon-summary .rs {
      background: #fff; padding: 2px 7px; border-radius: 10px; font-weight: 700;
    }
    .ribbon-summary .rs b { margin-left: 3px; }
    .ribbon-summary .rs.total, .ribbon-summary .rs.total b { color: #0d2c6b; }
    .ribbon-summary .rs.sent, .ribbon-summary .rs.sent b { color: #1da851; }
    .ribbon-summary .rs.failed, .ribbon-summary .rs.failed b { color: #e74c3c; }
    .ribbon-filters { display: flex; align-items: center; gap: 5px; flex-shrink: 1; margin-left: auto; min-width: 0; }
    .ribbon-filters .rf { display: flex; align-items: center; gap: 3px; font-size: 0.66rem; }
    .ribbon-filters .rf label { color: #d6fff0; font-weight: 600; }
    .ribbon-filters .rf input, .ribbon-filters .rf select {
      padding: 3px 4px; border: none; border-radius: 4px; font-size: 0.72rem;
    }
    .ribbon-filters .rf input[type="date"] { width: 108px; }
    .ribbon-filters .rf select { padding: 3px 2px; max-width: 60px; }
    .rbtn {
      border: none; border-radius: 4px; padding: 4px 8px; font-size: 0.72rem;
      font-weight: 600; cursor: pointer; color: #fff; flex-shrink: 0;
    }
    .rbtn.apply { background: #25D366; }
    .rbtn.reset { background: #6c8c86; }
    .rbtn.excel { background: #1d6f42; }
    .rbtn.print { background: #444; }
    .rbtn.danger { background: #e74c3c; }
    .rbtn.close { background: rgba(255,255,255,0.25); font-size: 16px; line-height: 1; padding: 2px 8px; }
    .rbtn:hover { opacity: 0.9; }

    .report-container { max-width: 100%; margin: 0 auto; padding: 8px 12px; }
    .report-header { display: none; }
    .filters {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
      background: #fff; padding: 10px 14px; border-radius: 8px; margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .filters .field { display: flex; flex-direction: column; gap: 4px; }
    .filters label { font-size: 0.78rem; font-weight: 600; color: #555; }
    .filters input, .filters select {
      padding: 8px 10px; border: 1.5px solid #e0e0e0; border-radius: 6px; font-size: 0.85rem;
    }
    .filters input:focus, .filters select:focus { outline: none; border-color: #25D366; }
    /* Toolbar: summary left, filters right, single line */
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap; margin-bottom: 8px;
      background: #fff; padding: 8px 12px; border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .summary-inline { display: flex; gap: 16px; align-items: center; font-size: 0.9rem; }
    .summary-inline .stat { color: #555; }
    .summary-inline .stat b { font-size: 1.05rem; margin-left: 4px; }
    .summary-inline .stat.total b { color: #128C7E; }
    .summary-inline .stat.sent b { color: #25D366; }
    .summary-inline .stat.failed b { color: #e74c3c; }
    .filters-inline { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
    .filters-inline .fg { display: flex; flex-direction: column; gap: 2px; }
    .filters-inline label { font-size: 0.7rem; font-weight: 600; color: #777; }
    .filters-inline input, .filters-inline select {
      padding: 5px 8px; border: 1.5px solid #e0e0e0; border-radius: 5px; font-size: 0.82rem;
    }
    .filters-inline input:focus, .filters-inline select:focus { outline: none; border-color: #25D366; }
    .table-wrap {
      background: #fff; border-radius: 6px; overflow-y: auto; overflow-x: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      max-height: calc(100vh - 70px);
    }
    .print-summary { font-size: 12px; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    th, td {
      padding: 3px 8px; text-align: left;
      border: 1px solid #e3e3e3; /* excel-like gridlines */
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    th {
      background: #f0f2f5; font-weight: 600; position: sticky; top: 0; z-index: 2;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; color: #444;
    }
    tbody tr:nth-child(even) { background: #f8fafb; } /* zebra */
    tbody tr:hover { background: #eef6f1; }
    td { line-height: 1.4; }
    /* Compact number/status columns */
    td:first-child, th:first-child { text-align: center; width: 40px; }
    .badge-status { padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge-status.sent { background: #e8f8ef; color: #1da851; }
    .badge-status.failed { background: #fdecea; color: #e74c3c; }
    .actions-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .delete-before {
      display: flex; align-items: center; gap: 5px;
      background: #fff5f5; border: 1px solid #f5c6c6; border-radius: 6px; padding: 3px 8px;
    }
    .delete-before label { font-size: 0.75rem; font-weight: 600; color: #c0392b; }
    .delete-before input { padding: 4px 6px; border: 1px solid #e0c0c0; border-radius: 5px; font-size: 0.8rem; }
    .empty { text-align: center; padding: 40px; color: #999; }
    /* Print header - hidden on screen, shown on print */
    .print-header { display: none; }

    @media print {
      @page { margin: 12mm; }
      .no-print { display: none !important; }
      body { background: #fff; font-size: 11px; }
      .report-container { max-width: 100%; padding: 0; }
      .table-wrap { box-shadow: none; border: none; }
      table { font-size: 10px; }
      th, td { padding: 5px 7px; border: 1px solid #ccc; }
      th { background: #f0f0f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .badge-status { border: none; padding: 0; font-weight: 600; background: none !important; }
      .badge-status.sent { color: #128C7E !important; -webkit-print-color-adjust: exact; }
      .badge-status.failed { color: #c0392b !important; -webkit-print-color-adjust: exact; }
      tr { page-break-inside: avoid; }
      thead { display: table-header-group; } /* repeat header on each page */
      .summary-cards { margin-bottom: 12px; gap: 8px; }
      .summary-card { padding: 8px 12px; box-shadow: none; border: 1px solid #ddd; }
      .summary-card .num { font-size: 1.2rem; }
      .print-header { display: block; text-align: center; margin-bottom: 8px; }
      .print-header h2 { font-size: 16px; margin-bottom: 4px; }
      .print-header .meta { font-size: 10px; color: #555; }
      .print-summary { display: block !important; text-align: center; margin-bottom: 10px; }
    }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff; border-radius: 12px; padding: 24px; width: 90%; max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .modal h2 { font-size: 1.1rem; margin-bottom: 16px; }
    .modal .field { margin-bottom: 14px; }
    .modal label { display: block; font-size: 0.82rem; font-weight: 600; color: #555; margin-bottom: 5px; }
    .modal select, .modal input {
      width: 100%; padding: 9px 12px; border: 1.5px solid #e0e0e0; border-radius: 6px; font-size: 0.88rem;
    }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  </style>
</head>
<body>
  <!-- Green ribbon: everything in one line -->
  <div class="ribbon no-print">
    <span class="ribbon-title">📊 Report</span>
    <span class="ribbon-summary">
      <span class="rs total">Total <b id="cardTotal">0</b></span>
      <span class="rs sent">Sent <b id="cardSent">0</b></span>
      <span class="rs failed">Failed <b id="cardFailed">0</b></span>
    </span>
    <span class="ribbon-filters">
      <span class="rf"><label>From</label><input type="date" id="fromDate"></span>
      <span class="rf"><label>To</label><input type="date" id="toDate"></span>
      <span class="rf"><label>Status</label>
        <select id="statusFilter">
          <option value="all">All</option>
          <option value="Sent">Sent</option>
          <option value="Failed">Failed</option>
        </select>
      </span>
      <span class="rf"><label>Source</label>
        <select id="sourceFilter">
          <option value="all">All</option>
          <option value="sheet">Sheet</option>
          <option value="manual">Manual</option>
        </select>
      </span>
      <button class="rbtn apply" id="applyBtn">Apply</button>
      <button class="rbtn reset" id="resetBtn">Reset</button>
      <button class="rbtn excel" id="excelBtn">Excel</button>
      <button class="rbtn print" id="printBtn">Print</button>
      <span class="rf"><label>Del&nbsp;before</label><input type="date" id="deleteBeforeDate"></span>
      <button class="rbtn danger" id="deleteBeforeBtn">Delete</button>
      <button class="rbtn close" id="closeReportBtn" title="Close">&times;</button>
    </span>
    <a href="/" id="dashboardLink" style="display:none">Dashboard</a>
  </div>

  <div class="report-container">
    <!-- Print-only header -->
    <div class="print-header">
      <h2>WhatsApp Message Report</h2>
      <div class="meta" id="printMeta"></div>
    </div>

    <!-- Print-only summary -->
    <div class="print-summary" style="display:none;">
      <span>Total: <b id="printTotal">0</b></span> &nbsp;|&nbsp;
      <span>Sent: <b id="printSent">0</b></span> &nbsp;|&nbsp;
      <span>Failed: <b id="printFailed">0</b></span>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table id="reportTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>Time</th>
            <th>Sender</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Source</th>
            <th>Remark</th>
          </tr>
        </thead>
        <tbody id="reportBody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none;">No records found for the selected filter.</div>
    </div>
  </div>

  <!-- Page Setup Modal -->
  <div class="modal-overlay" id="pageSetupModal">
    <div class="modal">
      <h2>Page Setup & Print</h2>
      <div class="field">
        <label>Orientation</label>
        <select id="orientationSel">
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </div>
      <div class="field">
        <label>Page Size</label>
        <select id="pageSizeSel">
          <option value="A4">A4</option>
          <option value="Letter">Letter</option>
          <option value="Legal">Legal</option>
          <option value="A3">A3</option>
        </select>
      </div>
      <div class="field">
        <label>Margin</label>
        <select id="marginSel">
          <option value="12mm">Normal (12mm)</option>
          <option value="6mm">Narrow (6mm)</option>
          <option value="20mm">Wide (20mm)</option>
          <option value="0mm">None</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-sm" id="cancelSetupBtn" style="background:#999;color:#fff;">Cancel</button>
        <button class="btn btn-sm btn-primary" id="doPrintBtn">Print Preview →</button>
      </div>
    </div>
  </div>

  <script src="report.js"></script>
</body>
</html>
